name: Builds

on:
  push:
    branches:
      - lylat/dolphin-matchmaking
      - "lylat/ci-*"
    paths-ignore:
      - "**.md"
      - "**.ini"
  pull_request:
    branches: [ lylat/dolphin-matchmaking ]
    paths-ignore:
      - "**.md"
      - "**.ini"
  workflow_dispatch:

# Upstream Dolphin master needs Visual Studio 2026 (Source/PCH/pch.h refuses older MSVC),
# C++23 (GCC 13 or later on Linux) and macOS 11 or later. windows-2025 carries VS 2026 since
# June 2026. The artifact actions before v4 are switched off by GitHub, and macos-10.15 no
# longer exists, which is why the old workflow failed or waited before building anything.

jobs:
  windows:
    name: "Windows Netplay"
    runs-on: windows-2025
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Version info"
        shell: bash
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 || echo untagged)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: "Build Netplay Dolphin"
        shell: cmd
        run: |
          cmake -S . -B Build\x64 -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build Build\x64 || exit /b 1
          xcopy /Y /E /I .\Build\x64\Binaries .\Binary\x64
      - name: "Package"
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force .\Data\Sys .\Binary\x64\Sys
          New-Item -ItemType File -Force .\Binary\x64\portable.txt | Out-Null
          Set-Content .\Binary\x64\FIX-VCRUNTIME140-ERROR.txt "Download and install this: https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $name = "${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-windows64-netplay.zip"
          New-Item -ItemType Directory -Force artifact | Out-Null
          7z a "artifact\$name" .\Binary\x64\*
      - name: "Publish"
        uses: actions/upload-artifact@v4
        with:
          name: windows64-netplay
          path: ./artifact/

  linux:
    name: "Linux Netplay"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Version info"
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 || echo untagged)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 cmake make pkg-config git wget file libfuse2 \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libxi-dev libxrandr-dev libudev-dev libevdev-dev libsfml-dev \
            libminiupnpc-dev libmbedtls-dev libcurl4-openssl-dev libhidapi-dev \
            libsystemd-dev libbluetooth-dev libasound2-dev libpulse-dev \
            libpugixml-dev libbz2-dev libzstd-dev liblzo2-dev libpng-dev \
            libusb-1.0-0-dev libegl1-mesa-dev gettext
      - name: "Build Netplay Dolphin"
        run: |
          git config core.fileMode false
          chmod +x ./build-linux.sh && ./build-linux.sh netplay
      - name: "Build AppImage"
        run: |
          chmod +x ./build-appimage.sh && ./build-appimage.sh netplay
      - name: "Package"
        run: |
          mkdir -p artifact
          FILE_NAME="${CURR_DATE}-${GIT_HASH}-${GIT_TAG}-linux.zip"
          chmod +x ./*.AppImage
          zip -r "${FILE_NAME}" ./*.AppImage*
          mv "${FILE_NAME}" ./artifact/
      - name: "Publish"
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ./artifact/

  macOS:
    name: "macOS Netplay"
    runs-on: macos-15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Version info"
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 || echo untagged)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Install prerequisites"
        run: |
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          brew install qt@6 pkgconf
      - name: "Build Netplay Dolphin"
        run: |
          git config core.fileMode false
          chmod +x ./build-mac.sh && ./build-mac.sh netplay
      - name: "Package"
        run: |
          mkdir -p artifact
          FILE_NAME="${CURR_DATE}-${GIT_HASH}-${GIT_TAG}-macOS-netplay.zip"
          cd ./build/Binaries/
          zip -r -y "${FILE_NAME}" "Dolphin.app"
          mv "${FILE_NAME}" ../../artifact/
      - name: "Publish"
        uses: actions/upload-artifact@v4
        with:
          name: macOS-netplay
          path: ./artifact/
